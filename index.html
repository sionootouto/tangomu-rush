
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TANGOMU RUSH</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>TANGOMU RUSH</h1>
    <button id="startButton" onclick="startGame()">ゲームスタート</button>
    <p>残り時間：<span id="timer">60</span>秒</p>
    <p>スコア：<span id="score">0</span></p>
    <div id="letterBoard"></div>
    <p id="sequenceMessage">まず「t」を押そう！</p>
    <p>押した文字：<span id="tappedLetter">まだ押されていない</span></p>
    <script>
        function createCards() {
            const letters = ["t", "a", "n", "g", "o", "m", "u"];

            const board = document.getElementById("letterBoard");
            board.textContent = "";

            for (let i = 0; i < letters.length; i++) {
                const card = document.createElement("button");

                card.textContent = letters[i];
                card.onclick = function() {
                    const tapped = letters[i]
                    
                    document.getElementById("tappedLetter").textContent = tapped;

                    if (tapped === letters[nextLetterIndex]) {
                        nextLetterIndex++;

                        if (nextLetterIndex === letters.length) {
                            document.getElementById("sequenceMessage").textContent = "1セット完成！";
                            nextLetterIndex = 0;
                            score++;
                            document.getElementById("score").textContent = score;
                        } else {
                            document.getElementById("sequenceMessage").textContent = 
                                "正解！次は「" + letters[nextLetterIndex] + "」";
                        }
                    } else {
                        if (timeLeft > 0) {
                          document.getElementById("sequenceMessage").textContent =
                              "順番ちがう！次は「" + letters[nextLetterIndex] + "」";
                          timeLeft = timeLeft - 1;
                          document.getElementById("timer").textContent = timeLeft;  
                          if (timeLeft <= 0) {
                              endGame();
                          }
                        }
                    }
                    
                };
                board.appendChild(card);
            }
        }

        let nextLetterIndex = 0;
        let score = 0;
        let timeLeft = 60;
        let countdown;
        let gameEnded = 0; /*ゲームが終わってなければ0、終わってたら1*/

        function endGame() {
            if (gameEnded == 0) {
                gameEnded = 1;
                clearInterval(countdown);
                document.getElementById("startButton").disabled = false;
                alert("時間切れ！");
            }
        }
        
        function startGame() {
            document.getElementById("startButton").disabled = true;
            nextLetterIndex = 0;
            score = 0;
            timeLeft = 60;
            gameEnded = 0;
            document.getElementById("score").textContent = score;
            createCards();

            document.getElementById("timer").textContent = timeLeft;

            countdown = setInterval(function() {
                timeLeft = timeLeft - 1;

                if (timeLeft < 0) {
                    timeLeft = 0;
                }

                document.getElementById("timer").textContent = timeLeft;
                if (timeLeft <= 0) {
                    endGame();
                }
                
            }, 1000);

        }
    </script>
</body>
</html>
