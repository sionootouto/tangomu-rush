
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TANGOMU RUSH</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>TANGOMU RUSH</h1>
    <button id="startButton" onclick="startGame()">ゲームスタート</button>
    <p>残り時間：<span id="timer">60</span>秒</p>
    <div id="letterBoard"></div>
    <script>
        function createCards() {
            const letters = ["t", "a", "n", "g", "o", "m", "u"];

            const board = document.getElementById("letterBoard");
            board.textContent = "";

            for (let i = 0; i < letters.length; i++) {
                const card = document.createElement("button");

                card.textContent = letters[i];

                board.appendChild(card);
            }
        }
        
        function startGame() {
            let timeLeft = 60;
            document.getElementById("startButton").disabled = true;
            createCards();

            document.getElementById("timer").textContent = timeLeft;

            const countdown = setInterval(function() {
                timeLeft = timeLeft - 1;
                document.getElementById("timer").textContent = timeLeft;

                if (timeLeft <= 0) {
                    clearInterval(countdown);
                    document.getElementById("startButton").disabled = false;
                    alert("時間切れ！");
                }
            }, 1000);
        }
    </script>
</body>
</html>
